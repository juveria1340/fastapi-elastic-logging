name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v

  smoke-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      # Elasticsearch commonly needs this raised on the Docker host, otherwise
      # it can be slow/flaky creating indices even while reporting healthy.
      - name: Raise vm.max_map_count for Elasticsearch
        run: sudo sysctl -w vm.max_map_count=262144

      # Uses docker-compose.ci.yml, which swaps in a throwaway local
      # Elasticsearch + non-secret filebeat.ci.yml instead of the real,
      # gitignored filebeat.yml / Elastic Cloud. No secrets required, and
      # nothing gets written to production data.
      - name: Start stack (FastAPI + Filebeat + local Elasticsearch)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:9200/_cluster/health >/dev/null; then
              echo "Elasticsearch is up"
              exit 0
            fi
            echo "Waiting for Elasticsearch... ($i)"
            sleep 3
          done
          echo "Elasticsearch never became healthy"
          exit 1

      - name: Wait for FastAPI app
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health >/dev/null; then
              echo "FastAPI app is up"
              exit 0
            fi
            echo "Waiting for FastAPI app... ($i)"
            sleep 2
          done
          echo "FastAPI app never came up"
          exit 1

      - name: Post a test event
        id: post_event
        run: |
          RESPONSE=$(curl -s -X POST http://localhost:8000/jobs \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Smoke Test Role","company":"CI","location":"GitHub Actions"}')
          echo "response=$RESPONSE"
          REQUEST_ID=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"

      - name: Assert event landed in Elasticsearch
        run: |
          REQUEST_ID="${{ steps.post_event.outputs.request_id }}"
          for i in $(seq 1 40); do
            COUNT=$(curl -s "http://localhost:9200/filebeat-*/_count?q=request_id:$REQUEST_ID" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('count', 0))")
            if [ "$COUNT" = "1" ]; then
              echo "Event found in Elasticsearch after $i attempt(s)"
              exit 0
            fi
            echo "Waiting for event to be indexed... ($i)"
            sleep 5
          done

          echo "::error::Event never appeared in Elasticsearch after 200s - dumping diagnostics"
          echo "--- Elasticsearch indices ---"
          curl -s "http://localhost:9200/_cat/indices?v"
          echo "--- Raw count response ---"
          curl -s "http://localhost:9200/filebeat-*/_count?q=request_id:$REQUEST_ID"
          echo
          echo "--- filebeat container logs (last 100 lines) ---"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=100 filebeat
          echo "--- elasticsearch container logs (last 50 lines) ---"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --tail=50 elasticsearch
          exit 1

      - name: Dump service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
