# Override used only in CI: adds a throwaway local Elasticsearch and points
# Filebeat at it instead of the real (gitignored) filebeat.yml / Elastic Cloud.
# Usage: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  filebeat:
    volumes:
      - ./filebeat.ci.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/usr/share/filebeat/logs:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      fastapi-app:
        condition: service_started
